[project]
name = "lte-sampler-residential"
version = "0.1.0"
description = "LTE-Sampler-Residential: draws synthetic dwellings from a Bayesian network and maps them to OpenStudio-HPXML arguments for SimParc."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "coverage>=7.12.0",
    "dask[complete]>=2025.5.1",
    "dtale[streamlit]>=3.18.2",
    "ipykernel>=6.29.5",
    "joblib>=1.5.2",
    "matplotlib>=3.10.0",
    "notebook>=7.4.5",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "plotly>=6.2.0",
    "numpy>=2.0",
    "pyagrum>=2.1.1",
    "pyarrow>=20.0.0",
    "pyshp>=3.1.4",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "streamlit>=1.47.1",
    "uv>=0.8.3",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"
