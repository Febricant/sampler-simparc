[project]
name = "simparc"
version = "0.1.0"
description = "Simulateur de parc de batiments: runs a CSV of dwellings through OpenStudio-HPXML / EnergyPlus in parallel with Dask."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dask[complete]>=2025.5.1",
    "ipykernel>=6.29.5",
    "pandas>=2.2.3",
    "pyarrow>=20.0.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# SimParc runs as loose scripts on sys.path (config.py, main.py and their
# siblings import each other by bare module name) and declares no
# [build-system]. Tell uv not to try to build it as a distribution.
[tool.uv]
package = false
